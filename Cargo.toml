[package]
name = "player-tui"
version = "0.1.0"
description = "A small TUI app to quickly control playing audio with."
authors = ["bedantH <bedanthota@gmail.com>"]
license = "MIT"
edition = "2024"

[dependencies]
color-eyre = "0.6.3"
crossterm = "0.29.0"
image = "0.25.9"
ratatui = "0.30.0"
ratatui-image = "10.0.2"
urlencoding = "2.1.3"
lofty = "0.21.0"

# Read the optimization guideline for more details: https://ratatui.rs/recipes/apps/release-your-app/#optimizations
[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
